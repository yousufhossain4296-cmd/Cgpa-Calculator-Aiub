<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIUB CGPA Calculator</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1><i class="fa-solid fa-graduation-cap"></i> AIUB CGPA Calculator</h1>

            <p class="subtitle">
                Enter your marks below to calculate your semester CGPA.
            </p>

            <div class="input-grid">

                <div class="input-box">
                    <label>English</label>
                    <input type="number" id="english" min="0" max="100" placeholder="0 - 100">
                </div>

                <div class="input-box">
                    <label>Mathematics</label>
                    <input type="number" id="math" min="0" max="100" placeholder="0 - 100">
                </div>

                <div class="input-box">
                    <label>Physics Theory</label>
                    <input type="number" id="physicsTheory" min="0" max="100" placeholder="0 - 100">
                </div>

                <div class="input-box">
                    <label>Introduction to Programming</label>
                    <input type="number" id="programming" min="0" max="100" placeholder="0 - 100">
                </div>

                <div class="input-box">
                    <label>Introduction to Computer Studies</label>
                    <input type="number" id="ics" min="0" max="100" placeholder="0 - 100">
                </div>

                <div class="input-box">
                    <label>Physics Lab</label>
                    <input type="number" id="physicsLab" min="0" max="100" placeholder="0 - 100">
                </div>

                <div class="input-box">
                    <label>Programming Lab</label>
                    <input type="number" id="programmingLab" min="0" max="100" placeholder="0 - 100">
                </div>

            </div>

            <div class="button-area">
                <button onclick="calculateCGPA()">
                    <i class="fa-solid fa-calculator"></i>
                    Calculate CGPA
                </button>
            </div>

        </div>

        <!-- Result Card -->

        <div class="result-card">

            <h2>
                <i class="fa-solid fa-chart-simple"></i>
                Result
            </h2>

            <table>

                <tr>
                    <th>Course</th>
                    <th>Grade Point</th>
                </tr>

                <tr>
                    <td>English</td>
                    <td id="gpEnglish">-</td>
                </tr>

                <tr>
                    <td>Mathematics</td>
                    <td id="gpMath">-</td>
                </tr>

                <tr>
                    <td>Physics Theory</td>
                    <td id="gpPhysicsTheory">-</td>
                </tr>

                <tr>
                    <td>Programming</td>
                    <td id="gpProgramming">-</td>
                </tr>

                <tr>
                    <td>ICS</td>
                    <td id="gpICS">-</td>
                </tr>

                <tr>
                    <td>Physics Lab</td>
                    <td id="gpPhysicsLab">-</td>
                </tr>

                <tr>
                    <td>Programming Lab</td>
                    <td id="gpProgrammingLab">-</td>
                </tr>

            </table>

            <div class="cgpa-box">

                <h3>Your Semester CGPA</h3>

                <div id="cgpa">
                    0.00
                </div>

            </div>

        </div>

    </div>
    <!-- <p>Made by chatgpt , promted by Shiam </p> -->

    <script src="script.js"></script>

</body>

</html>
